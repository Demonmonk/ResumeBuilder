<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wingman — Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #09090f;
  color: #e2e2e8;
  min-height: 100vh;
}

/* Layout */
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: 320px;
  flex-shrink: 0;
  border-right: 1px solid #1e1e2a;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 18px 16px;
  border-bottom: 1px solid #1e1e2a;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: white;
}

.logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }

.sidebar-filters {
  padding: 12px;
  display: flex;
  gap: 6px;
  border-bottom: 1px solid #1e1e2a;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 5px 10px;
  border: 1px solid #1e1e2a;
  border-radius: 20px;
  background: transparent;
  color: #666;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.filter-btn:hover { border-color: #333; color: #888; }
.filter-btn.active { background: #6366f1; border-color: #6366f1; color: white; }

.job-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.job-item {
  padding: 12px 14px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  margin-bottom: 4px;
}

.job-item:hover { background: #13131a; }
.job-item.selected { background: #13131a; border-color: #6366f1; }

.job-item-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.job-item-company {
  font-size: 12px;
  color: #666;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.job-item-meta {
  display: flex;
  align-items: center;
  gap: 6px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.badge-processing { background: #1a1600; color: #f59e0b; border: 1px solid #3a2a00; }
.badge-ready      { background: #12101f; color: #6366f1; border: 1px solid #2a2060; }
.badge-approved   { background: #0d1f1a; color: #4ade80; border: 1px solid #1a3a2a; }
.badge-applied    { background: #0a1a10; color: #22c55e; border: 1px solid #1a3a20; }
.badge-skipped    { background: #151515; color: #444; border: 1px solid #222; }
.badge-error      { background: #1f0d0d; color: #f87171; border: 1px solid #3a1010; }

.job-item-date { font-size: 11px; color: #444; margin-left: auto; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #444;
  font-size: 13px;
  line-height: 1.7;
}

/* Main panel */
.main {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.main-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
  font-size: 14px;
  flex-direction: column;
  gap: 8px;
}

.main-empty .big { font-size: 40px; }

/* Detail view */
.detail { padding: 28px 32px; flex: 1; }

.detail-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
}

.detail-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
.detail-company { font-size: 14px; color: #666; }
.detail-url { font-size: 12px; color: #6366f1; cursor: pointer; margin-top: 4px; }
.detail-url:hover { text-decoration: underline; }

.detail-actions { display: flex; gap: 8px; flex-shrink: 0; }

.btn {
  padding: 9px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-approve  { background: #6366f1; color: white; }
.btn-approve:hover { background: #5254cc; }
.btn-approve:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-apply    { background: #16a34a; color: white; }
.btn-apply:hover { background: #15803d; }

.btn-skip     { background: transparent; color: #555; border: 1px solid #1e1e2a; }
.btn-skip:hover { border-color: #333; color: #888; }

.btn-regen    { background: transparent; color: #6366f1; border: 1px solid #2a2060; font-size: 12px; padding: 7px 12px; }
.btn-regen:hover { background: #12101f; }

.btn-delete   { background: transparent; color: #ef4444; border: 1px solid #3a1010; font-size: 12px; padding: 7px 12px; }
.btn-delete:hover { background: #1f0d0d; }

/* Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid #1e1e2a;
  margin-bottom: 24px;
  gap: 0;
}

.tab {
  padding: 10px 18px;
  font-size: 13px;
  cursor: pointer;
  color: #555;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-weight: 500;
}

.tab:hover { color: #888; }
.tab.active { color: #e2e2e8; border-bottom-color: #6366f1; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Matches */
.matches { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }

.match-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: #0d1f1a;
  border: 1px solid #1a3a2a;
  border-radius: 8px;
  font-size: 13px;
  color: #4ade80;
  line-height: 1.4;
}

.match-item::before { content: '✓'; flex-shrink: 0; }

/* Change cards */
.change-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: #0c0c14;
  border: 1px solid #1e1e2a;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.change-card:hover { border-color: #2a2a3a; }
.change-card.dimmed { opacity: 0.4; }
.change-card input[type="checkbox"] { margin-top: 2px; flex-shrink: 0; accent-color: #6366f1; width: 15px; height: 15px; cursor: pointer; }
.change-body { flex: 1; min-width: 0; }
.change-section-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #555; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
.change-original { font-size: 12.5px; color: #f87171; background: #200d0d; border-radius: 5px; padding: 7px 10px; line-height: 1.5; margin-bottom: 4px; }
.change-arrow { font-size: 11px; color: #444; margin: 3px 0; }
.change-reason-inline { font-style: italic; color: #444; font-size: 11px; }
.change-suggested { font-size: 12.5px; color: #4ade80; background: #0d2010; border-radius: 5px; padding: 7px 10px; line-height: 1.5; }
.addition-reason { font-size: 11px; color: #555; margin-top: 6px; font-style: italic; }
.type-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 6px; border-radius: 8px; flex-shrink: 0; }
.badge-reframe { background: #12101f; color: #818cf8; border: 1px solid #2a2060; }
.badge-new     { background: #0f1f12; color: #4ade80; border: 1px solid #1a3a20; }

/* Page estimate */
.page-ok      { font-size: 12px; color: #555; margin: 16px 0 8px; }
.page-warning { font-size: 12px; color: #f59e0b; background: #1a1200; border: 1px solid #3a2800; border-radius: 7px; padding: 8px 12px; margin: 16px 0 8px; }

/* Download buttons */
.download-row { display: flex; gap: 8px; margin-top: 4px; }
.btn-dl { background: #13131a; color: #e2e2e8; border: 1px solid #2a2a3a; font-size: 12px; padding: 8px 14px; border-radius: 7px; cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.15s; }
.btn-dl:hover { border-color: #6366f1; color: #818cf8; }

/* Error box */
.error-box { padding: 14px; background: #1f0d0d; border: 1px solid #3a1010; border-radius: 10px; color: #f87171; font-size: 13px; }

/* JD text */
.jd-text { font-size: 13px; color: #666; line-height: 1.8; white-space: pre-wrap; max-height: 480px; overflow-y: auto; background: #0c0c14; padding: 16px; border-radius: 10px; border: 1px solid #1e1e2a; }

/* Cover letter editor */
.cover-letter-editor {
  width: 100%;
  background: #13131a;
  border: 1px solid #1e1e2a;
  border-radius: 10px;
  color: #e2e2e8;
  font-size: 13px;
  padding: 16px;
  line-height: 1.8;
  min-height: 300px;
  resize: vertical;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}

.cover-letter-editor:focus { border-color: #6366f1; }

/* Notes to AI */
.regen-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.regen-input {
  flex: 1;
  background: #13131a;
  border: 1px solid #1e1e2a;
  border-radius: 8px;
  color: #e2e2e8;
  font-size: 13px;
  padding: 10px 12px;
  font-family: inherit;
  outline: none;
}

.regen-input:focus { border-color: #6366f1; }
.regen-input::placeholder { color: #444; }

/* Processing state */
.processing-state {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px;
  background: #13131a;
  border: 1px solid #1e1e2a;
  border-radius: 10px;
  font-size: 14px;
  color: #888;
}

.spinner {
  width: 18px; height: 18px;
  border: 2px solid #333;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #444;
  margin-bottom: 12px;
}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">W</div>
      <div class="logo-text">Wingman</div>
      <button id="btn-export-profile" title="Export profile backup (saves your resume + API key so you don't have to re-upload after reloading the extension)" style="margin-left:auto;background:transparent;border:1px solid #1e1e2a;border-radius:6px;color:#555;font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit;white-space:nowrap">⬇ backup</button>
    </div>

    <div class="sidebar-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ready">Ready</button>
      <button class="filter-btn" data-filter="approved">Approved</button>
      <button class="filter-btn" data-filter="applied">Applied</button>
      <button class="filter-btn" data-filter="processing">Processing</button>
    </div>

    <div class="job-list" id="job-list">
      <div class="empty-state">No saved jobs yet.<br>Browse LinkedIn and hit Save.</div>
    </div>
  </div>

  <!-- Main panel -->
  <div class="main" id="main">
    <div class="main-empty">
      <div class="big">✦</div>
      <div>Select a job to review</div>
    </div>
  </div>

</div>

<script src="docx-editor.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
