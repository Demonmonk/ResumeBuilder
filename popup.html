<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 300px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0c0c0f;
  color: #e2e2e8;
}

.header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid #1e1e2a;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 7px;
}

.logo-mark {
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.logo-text {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.dash-link {
  font-size: 11px;
  color: #6366f1;
  cursor: pointer;
  text-decoration: none;
}

.dash-link:hover { text-decoration: underline; }

/* Job detection */
.job-card {
  margin: 12px 12px 0;
  padding: 11px 13px;
  background: #13131a;
  border: 1px solid #1e1e2a;
  border-radius: 10px;
}

.job-site {
  font-size: 10px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.job-title {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.job-company {
  font-size: 12px;
  color: #888;
}

.no-job {
  margin: 16px 12px;
  padding: 16px;
  text-align: center;
  color: #555;
  font-size: 12px;
  line-height: 1.6;
}

/* Buttons */
.actions {
  padding: 10px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.btn {
  width: 100%;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.2px;
}

.btn-primary {
  background: #6366f1;
  color: white;
}

.btn-primary:hover:not(:disabled) { background: #5254cc; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  background: transparent;
  color: #555;
  border: 1px solid #1e1e2a;
  font-weight: 500;
}

.btn-secondary:hover { border-color: #333; color: #888; }

/* Queue stats */
.stats {
  display: flex;
  gap: 1px;
  margin: 0 12px 10px;
  background: #1e1e2a;
  border-radius: 8px;
  overflow: hidden;
}

.stat {
  flex: 1;
  padding: 8px 6px;
  text-align: center;
  background: #13131a;
  cursor: pointer;
  transition: background 0.1s;
}

.stat:first-child { border-radius: 8px 0 0 8px; }
.stat:last-child  { border-radius: 0 8px 8px 0; }
.stat:hover { background: #1a1a28; }

.stat-num {
  font-size: 16px;
  font-weight: 700;
  display: block;
}

.stat-label {
  font-size: 10px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.c-ready     { color: #6366f1; }
.c-processing { color: #f59e0b; }
.c-applied   { color: #4ade80; }

/* Status */
.status {
  margin: 0 12px 10px;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
  line-height: 1.5;
}

.status.saving {
  background: #13131a;
  border: 1px solid #1e1e2a;
  color: #888;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status.saved {
  background: #0d1f1a;
  border: 1px solid #1a3a2a;
  color: #4ade80;
  display: block;
}

.status.error {
  background: #1f0d0d;
  border: 1px solid #3a1010;
  color: #f87171;
  display: block;
}

.spinner {
  width: 12px;
  height: 12px;
  border: 1.5px solid #333;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">W</div>
    <div class="logo-text">Wingman</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <a class="dash-link" id="open-dash">Review Panel →</a>
    <a class="dash-link" id="open-settings" style="color:#555">⚙</a>
  </div>
</div>

<div id="stats-row" class="stats" style="margin-top:12px">
  <div class="stat" id="stat-ready">
    <span class="stat-num c-ready" id="num-ready">0</span>
    <span class="stat-label">Ready</span>
  </div>
  <div class="stat" id="stat-proc">
    <span class="stat-num c-processing" id="num-proc">0</span>
    <span class="stat-label">Processing</span>
  </div>
  <div class="stat" id="stat-applied">
    <span class="stat-num c-applied" id="num-applied">0</span>
    <span class="stat-label">Applied</span>
  </div>
</div>

<div id="job-section">
  <div id="job-card" class="job-card" style="display:none">
    <div class="job-site" id="job-site">—</div>
    <div class="job-title" id="job-title">—</div>
    <div class="job-company" id="job-company">—</div>
  </div>
  <div id="no-job" class="no-job">Navigate to a job listing<br>then click Save</div>
</div>

<div id="status" class="status"></div>

<div class="actions">
  <button class="btn btn-primary" id="btn-save" disabled>Save this job</button>
  <button class="btn btn-secondary" id="btn-skip">Skip</button>
</div>

<script src="popup.js"></script>
</body>
</html>
